# INACTIVE TEMPLATE: only install in the verified private repository after approval.
name: Private approved public-data export
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-public-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'morothon-no/historikk-admin' && github.ref == 'refs/heads/main' && vars.ADMIN_INFRA_ENABLED == 'true'
    environment: admin-export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: admin
          persist-credentials: false
      - name: Require a pinned public toolchain
        working-directory: admin
        run: |
          node -e 'const l=require("./toolchain-lock.json");if(!l.enabled||!/^[a-f0-9]{40}$/.test(l.publicCommit))process.exit(1);require("fs").appendFileSync(process.env.GITHUB_ENV,"PUBLIC_TOOLS_SHA="+l.publicCommit+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: morothon-no/historikk
          ref: ${{ env.PUBLIC_TOOLS_SHA }}
          path: public-code
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /public-data/
            /.github/public-data-approval.json
            /package.json
            /package-lock.json
            /js/
            /css/
            /assets/medals/approved/
            /assets/medals/identity/
            /assets/medals/service/
            /assets/medals/watermarks/
            /assets/fonts/
            /assets/icons/
            /assets/social/
            /index.html
            /heder.html
            /tests/fixtures/a1c-public-reference.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare runtime configuration after private environment review
        env:
          ADMIN_EXPORT_APPROVAL_JSON: ${{ vars.ADMIN_EXPORT_APPROVAL_JSON }}
          PUBLIC_DATA_VERSION: ${{ vars.PUBLIC_DATA_VERSION }}
        run: node public-code/scripts/admin/workflow-config.cjs export
      - name: Export with private environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node public-code/scripts/admin/operations.cjs export "$RUNNER_TEMP/morothon-export/config.json" "$RUNNER_TEMP/morothon-export/approval.json"
      - name: Retain only validated public payload inside private workflow
        uses: actions/upload-artifact@v4
        with:
          name: approved-public-candidate
          path: ${{ runner.temp }}/morothon-export/public-candidate/
          if-no-files-found: error
          retention-days: 7
  propose:
    needs: export
    if: github.repository == 'morothon-no/historikk-admin' && github.ref == 'refs/heads/main' && vars.ADMIN_INFRA_ENABLED == 'true'
    environment: public-data-proposal
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      # Clean runner: never checkout private registers or receive a private read token here.
      - name: Require reviewed publishing toolchain
        env:
          SHA: ${{ vars.PUBLIC_TOOLS_SHA }}
        run: |
          node -e 'if(!/^[a-f0-9]{40}$/.test(process.env.SHA||""))process.exit(1)'
      - uses: actions/checkout@v4
        with:
          repository: morothon-no/historikk
          ref: ${{ vars.PUBLIC_TOOLS_SHA }}
          token: ${{ secrets.PUBLIC_DATA_PROPOSER_TOKEN }}
          path: public-code
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /public-data/
            /.github/public-data-approval.json
            /package.json
            /js/
            /css/
            /assets/medals/approved/
            /assets/medals/identity/
            /assets/medals/service/
            /assets/medals/watermarks/
            /assets/fonts/
            /assets/icons/
            /assets/social/
            /index.html
            /heder.html
      - uses: actions/download-artifact@v4
        with:
          name: approved-public-candidate
          path: public-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare public-only configuration from protected environment
        env:
          PUBLIC_TOOLS_SHA: ${{ vars.PUBLIC_TOOLS_SHA }}
          APPROVED_MANIFEST_SHA256: ${{ vars.APPROVED_PUBLIC_MANIFEST_SHA256 }}
          PUBLISH_APPROVAL: ${{ vars.PUBLIC_PUBLISH_APPROVAL_JSON }}
        run: |
          node public-code/scripts/admin/workflow-config.cjs publish
      - name: Propose public update using public-repository-only service credential
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DATA_PROPOSER_TOKEN }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-public
        run: |
          git config --global user.name 'Morothon data service'
          git config --global user.email 'morothon-data@users.noreply.github.com'
          gh auth setup-git
          node public-code/scripts/admin/operations.cjs publish "$RUNNER_TEMP/morothon-publish/config.json" "$RUNNER_TEMP/morothon-publish/approval.json"
