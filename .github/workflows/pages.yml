name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_control:
        description: Run full public and trusted-source regression
        type: boolean
        default: false
      historical_reports:
        description: Also regenerate five historical comparison galleries (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: morothon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Trusted policy and test plan
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      level: ${{ steps.plan.outputs.level }}
      public_browser: ${{ steps.plan.outputs.public_browser }}
      public_pdf: ${{ steps.plan.outputs.public_pdf }}
      source_browser: ${{ steps.plan.outputs.source_browser }}
      source_pdf: ${{ steps.plan.outputs.source_pdf }}
      source_python: ${{ steps.plan.outputs.source_python }}
    defaults:
      run:
        working-directory: public
    steps:
      - name: Checkout public files only (sparse, blob-filtered)
        uses: actions/checkout@v4
        with:
          path: public
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /heder.html
            /package.json
            /package-lock.json
            /.github/workflows/
            /.github/public-data-approval.json
            /public-data/
            /js/
            /css/
            /assets/medals/approved/
            /assets/medals/service/
            /assets/medals/identity/
            /assets/medals/watermarks/
            /assets/fonts/
            /assets/icons/
            /assets/social/
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/review-public-export.cjs
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/check-history.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Checkout trusted base policy only
        uses: actions/checkout@v4
        with:
          path: policy-base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/public-data-approval.json
            /package.json
            /package-lock.json
            /js/history-data.js
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/review-public-export.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout and trusted policy before running PR code
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOROTHON_PUBLIC_DATA_SHA256: ${{ vars.MOROTHON_PUBLIC_DATA_SHA256 }}
          MOROTHON_REVIEWED_POLICY_HEAD: ${{ vars.MOROTHON_REVIEWED_POLICY_HEAD }}
        run: |
          test ! -e data
          test ! -e scripts/export-public-data.cjs
          test ! -e scripts/lib/public-data.cjs
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          guard="$GITHUB_WORKSPACE/policy-base/scripts/check-public-policy.cjs"
          test -f "$guard"
          node "$guard" "$GITHUB_WORKSPACE/public" "$GITHUB_WORKSPACE/policy-base" "$PR_HEAD_SHA" "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"
      - name: Select required levels with protected-base planner
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOROTHON_FULL_CONTROL: ${{ inputs.full_control || inputs.historical_reports }}
          MOROTHON_REVIEWED_POLICY_HEAD: ${{ vars.MOROTHON_REVIEWED_POLICY_HEAD }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            if ! git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"; then
              echo "Base range unavailable: planner will require full control."
            fi
          fi
          planner="$GITHUB_WORKSPACE/policy-base/scripts/testing/plan.cjs"
          # Routine PRs use base controls. A reviewed security upgrade can exercise its new controls.
          if [ "$MOROTHON_REVIEWED_POLICY_HEAD" = "$HEAD_SHA" ]; then
            planner="$GITHUB_WORKSPACE/public/scripts/testing/plan.cjs"
          fi
          test -f "$planner"
          node "$planner" "$GITHUB_WORKSPACE/public" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE/policy-base/test-plan.json"
      - name: Retain non-sensitive test selection
        uses: actions/upload-artifact@v4
        with:
          name: morothon-test-plan
          path: policy-base/test-plan.json
          retention-days: 14

  verify:
    name: Public package, policy and site build
    needs: plan
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: public
    steps:
      - name: Require successful trusted plan (never accept skipped planning)
        working-directory: ${{ github.workspace }}
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Checkout public files only (sparse, blob-filtered)
        uses: actions/checkout@v4
        with:
          path: public
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /heder.html
            /package.json
            /package-lock.json
            /.github/workflows/
            /.github/public-data-approval.json
            /public-data/
            /js/
            /css/
            /assets/medals/approved/
            /assets/medals/service/
            /assets/medals/identity/
            /assets/medals/watermarks/
            /assets/fonts/
            /assets/icons/
            /assets/social/
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/review-public-export.cjs
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/check-history.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Checkout trusted base policy only
        uses: actions/checkout@v4
        with:
          path: policy-base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/public-data-approval.json
            /package.json
            /package-lock.json
            /js/history-data.js
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/review-public-export.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout and trusted policy before running PR code
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOROTHON_PUBLIC_DATA_SHA256: ${{ vars.MOROTHON_PUBLIC_DATA_SHA256 }}
          MOROTHON_REVIEWED_POLICY_HEAD: ${{ vars.MOROTHON_REVIEWED_POLICY_HEAD }}
        run: |
          test ! -e data
          test ! -e scripts/export-public-data.cjs
          test ! -e scripts/lib/public-data.cjs
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          guard="$GITHUB_WORKSPACE/policy-base/scripts/check-public-policy.cjs"
          test -f "$guard"
          node "$guard" "$GITHUB_WORKSPACE/public" "$GITHUB_WORKSPACE/policy-base" "$PR_HEAD_SHA" "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"
      - name: Install public test dependencies only when browser tests are required
        if: needs.plan.outputs.public_browser == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public/package-lock.json
      - name: Install Node dependencies
        if: needs.plan.outputs.public_browser == 'true'
        run: npm ci
      - name: Cache pinned Chromium download
        if: needs.plan.outputs.public_browser == 'true'
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-ubuntu24-${{ hashFiles('public/package-lock.json') }}
      - name: Install Chromium system dependencies
        if: needs.plan.outputs.public_browser == 'true'
        run: npx playwright install-deps chromium
      - name: Install Chromium download on cache miss
        if: needs.plan.outputs.public_browser == 'true' && steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Select Chromium and install matching fonts
        if: needs.plan.outputs.public_browser == 'true'
        run: |
          printf 'CHROMIUM_PATH=%s\n' "$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          sudo apt-get install -y fonts-liberation fonts-urw-base35
      - name: Install PDF inspection tools only for print tests
        if: needs.plan.outputs.public_pdf == 'true'
        run: sudo apt-get install -y poppler-utils
      - name: Build from approved public package only
        run: npm run build -- _site public-data "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"
      - name: Run selected public-only regression tests once
        env:
          MOROTHON_TEST_SITE: ${{ github.workspace }}/public/_site
          MOROTHON_PUBLIC_REVIEW_DIR: /tmp/morothon-b1-public-review
          MOROTHON_C1_REVIEW_DIR: /tmp/morothon-c1-review
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOROTHON_REVIEWED_POLICY_HEAD: ${{ vars.MOROTHON_REVIEWED_POLICY_HEAD }}
        run: |
          runner="$GITHUB_WORKSPACE/policy-base/scripts/testing/run.cjs"
          if [ "$MOROTHON_REVIEWED_POLICY_HEAD" = "$PR_HEAD_SHA" ]; then
            runner="$GITHUB_WORKSPACE/public/scripts/testing/run.cjs"
          fi
          test -f "$runner"
          node "$runner" --root "$GITHUB_WORKSPACE/public" --scope public --level '${{ needs.plan.outputs.level }}'
      - name: Retain approved public export review generated by PDF tests
        if: github.event_name == 'pull_request' && needs.plan.outputs.public_pdf == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morothon-a1-offentlig-kontroll
          path: /tmp/morothon-b1-public-review/
          if-no-files-found: error
          retention-days: 14
      - name: Retain local C1 pilot review (public data only)
        if: needs.plan.outputs.public_pdf == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morothon-c1-diplomverksted
          path: /tmp/morothon-c1-review/
          if-no-files-found: error
          retention-days: 14
      - name: Validate public data boundary before artifact upload
        run: npm run public:kontroll -- _site "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"
      - name: Retain tested site artifact
        uses: actions/upload-artifact@v4
        with:
          name: morothon-site
          path: public/_site/
          if-no-files-found: error

  artifact_gate:
    name: Independent trusted artifact gate
    needs: verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: public
    steps:
      - name: Checkout public files only (sparse, blob-filtered)
        uses: actions/checkout@v4
        with:
          path: public
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /heder.html
            /package.json
            /package-lock.json
            /.github/workflows/
            /.github/public-data-approval.json
            /public-data/
            /js/
            /css/
            /assets/medals/approved/
            /assets/medals/service/
            /assets/medals/identity/
            /assets/medals/watermarks/
            /assets/fonts/
            /assets/icons/
            /assets/social/
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/review-public-export.cjs
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/check-history.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Checkout trusted base policy only
        uses: actions/checkout@v4
        with:
          path: policy-base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/public-data-approval.json
            /package.json
            /package-lock.json
            /js/history-data.js
            /scripts/build-site.cjs
            /scripts/check-public-site.cjs
            /scripts/check-public-policy.cjs
            /scripts/lib/public-schema.cjs
            /scripts/lib/public-package.cjs
            /scripts/lib/runtime-files.cjs
            /scripts/testing/
            /scripts/diploma-harness.cjs
            /scripts/diploma-admin.cjs
            /tools/diploma-admin/
            /scripts/review-public-export.cjs
            /tests/data-quality.cjs
            /tests/data-quality-browser.cjs
            /tests/public-modules.cjs
            /tests/public-build.cjs
            /tests/public-browser.cjs
            /tests/public-pdf.cjs
            /tests/regression.cjs
            /tests/loyalty-v32.cjs
            /tests/loyalty-visual.cjs
            /tests/regression-visual.cjs
            /tests/site-build.cjs
            /tests/test-planning.cjs
            /tests/public/
            /tests/helpers/public-package.cjs
            /tests/fixtures/a1c-public-reference.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout and trusted policy before running PR code
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOROTHON_PUBLIC_DATA_SHA256: ${{ vars.MOROTHON_PUBLIC_DATA_SHA256 }}
          MOROTHON_REVIEWED_POLICY_HEAD: ${{ vars.MOROTHON_REVIEWED_POLICY_HEAD }}
        run: |
          test ! -e data
          test ! -e scripts/export-public-data.cjs
          test ! -e scripts/lib/public-data.cjs
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          guard="$GITHUB_WORKSPACE/policy-base/scripts/check-public-policy.cjs"
          test -f "$guard"
          node "$guard" "$GITHUB_WORKSPACE/public" "$GITHUB_WORKSPACE/policy-base" "$PR_HEAD_SHA" "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"
      - name: Retrieve candidate artifact in fresh runner
        uses: actions/download-artifact@v4
        with:
          name: morothon-site
          path: candidate-site/
      - name: Validate artifact with trusted code, without running PR tests
        run: node "$GITHUB_WORKSPACE/policy-base/scripts/check-public-site.cjs" "$GITHUB_WORKSPACE/candidate-site" "$GITHUB_WORKSPACE/policy-base/accepted-approval.json"

  source_checks:
    name: Transitional trusted source regression
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main sources with historical provenance only when needed
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.plan.outputs.source_browser == 'true' && '0' || '1' }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup npm cache for source tests
        if: needs.plan.outputs.source_browser == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        if: needs.plan.outputs.source_browser == 'true'
        run: npm ci
      - name: Setup Python for full source regression
        if: needs.plan.outputs.source_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        if: needs.plan.outputs.source_python == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Cache pinned Chromium download
        if: needs.plan.outputs.source_browser == 'true'
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-ubuntu24-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        if: needs.plan.outputs.source_browser == 'true'
        run: npx playwright install-deps chromium
      - name: Install Chromium download on cache miss
        if: needs.plan.outputs.source_browser == 'true' && steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Select Chromium and install matching fonts
        if: needs.plan.outputs.source_browser == 'true'
        run: |
          printf 'CHROMIUM_PATH=%s\n' "$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          sudo apt-get install -y fonts-liberation fonts-urw-base35
      - name: Install PDF tools for full source regression
        if: needs.plan.outputs.source_pdf == 'true'
        run: sudo apt-get install -y poppler-utils
      - name: Check original export and run remaining required source regressions
        run: node scripts/testing/run.cjs --scope source --level '${{ needs.plan.outputs.level }}'
      - name: Render V3.6 honor review artifacts
        if: inputs.historical_reports == true
        run: node scripts/review-honors-v36.cjs /tmp/morothon-v36
      - name: Render V3.6.1 profile and founder-marker comparison
        if: inputs.historical_reports == true
        run: node scripts/review-honors-v361.cjs /tmp/morothon-v361
      - name: Render final V3.6.1 person and diploma corrections
        if: inputs.historical_reports == true
        run: node scripts/review-honors-final-v361.cjs /tmp/morothon-v361-final
      - name: Render V3.5.3 date and signature comparison
        if: inputs.historical_reports == true
        run: |
          mkdir -p /tmp/morothon-v353-source
          git archive 3e45c8b | tar -x -C /tmp/morothon-v353-source
          node /tmp/morothon-v353-source/scripts/build-site.cjs /tmp/morothon-v353-before
          node scripts/review-honor-signoff-v353.cjs /tmp/morothon-v353 /tmp/morothon-v353-before
      - name: Render V3.6.2 historical service diploma comparison
        if: inputs.historical_reports == true
        run: node scripts/review-service-milestones-v362.cjs /tmp/morothon-v362

  deploy:
    name: Publish tested main only
    needs: [artifact_gate, source_checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve tested site
        uses: actions/download-artifact@v4
        with:
          name: morothon-site
          path: _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
