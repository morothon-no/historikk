name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morothon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Regression tests and site build
    # Keep browser/font dependencies stable across ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with historical asset provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install PDF tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-liberation fonts-urw-base35
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium
        run: |
          npx playwright install chromium
          printf 'CHROMIUM_PATH=%s\n' "$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run all regression tests
        run: npm test
      - name: Build versioned runtime package
        run: npm run build
      - name: Render V3.5.2 honor review artifacts
        if: github.event_name == 'pull_request'
        run: node scripts/review-honors-v352.cjs /tmp/morothon-v352
      - name: Retain V3.5.2 honor review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: morothon-v352-forhaandsvisning
          path: /tmp/morothon-v352/
          if-no-files-found: error
          retention-days: 14
      - name: Retain tested site artifact
        uses: actions/upload-artifact@v4
        with:
          name: morothon-site
          path: _site/
          if-no-files-found: error

  deploy:
    name: Publish tested main only
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve tested site
        uses: actions/download-artifact@v4
        with:
          name: morothon-site
          path: _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
